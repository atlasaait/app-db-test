services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: app-db-config-api:latest
    init: true
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Paris
    volumes:
      # Le JSON reste sur le disque Windows : les modifications sont
      # visibles immédiatement, sans rebuild ni redémarrage.
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/produits')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s